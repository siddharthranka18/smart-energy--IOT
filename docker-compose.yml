services:
  postgres:
    image: postgres:16
    container_name: smart-energy-postgres
    environment:
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: energy
      POSTGRES_DB: smart_energy
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - smart_energy_pg:/var/lib/postgresql/data

volumes:
  smart_energy_pg:
